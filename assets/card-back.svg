<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350" width="250" height="350">
  <!-- card body -->
  <rect width="250" height="350" rx="12" fill="#1a1c1f"/>
  <!-- amber top bar -->
  <rect x="0" y="0" width="250" height="5" rx="3" fill="#d4a027"/>
  <!-- outer border -->
  <rect x="6" y="6" width="238" height="338" rx="9" fill="none" stroke="#2e3035" stroke-width="1.5"/>
  <!-- corn stalk left -->
  <line x1="70" y1="280" x2="70" y2="55" stroke="#2a2a1a" stroke-width="8" stroke-linecap="round"/>
  <!-- corn stalk right -->
  <line x1="105" y1="280" x2="105" y2="75" stroke="#2a2a1a" stroke-width="8" stroke-linecap="round"/>
  <!-- corn ear on left stalk -->
  <ellipse cx="70" cy="140" rx="11" ry="30" fill="#d4a027" opacity="0.85"/>
  <!-- corn ear on right stalk -->
  <ellipse cx="105" cy="160" rx="11" ry="30" fill="#d4a027" opacity="0.85"/>
  <!-- teal tops -->
  <line x1="70" y1="55" x2="70" y2="25" stroke="#3ea8aa" stroke-width="7" stroke-linecap="round"/>
  <line x1="105" y1="75" x2="105" y2="45" stroke="#3ea8aa" stroke-width="7" stroke-linecap="round"/>
  <!-- teal leaves -->
  <path d="M70 146 Q40 134 50 95" fill="none" stroke="#3ea8aa" stroke-width="5" stroke-linecap="round"/>
  <path d="M70 190 Q100 178 92 140" fill="none" stroke="#3ea8aa" stroke-width="5" stroke-linecap="round"/>
  <path d="M105 166 Q75 154 83 116" fill="none" stroke="#3ea8aa" stroke-width="5" stroke-linecap="round"/>
  <path d="M105 215 Q135 203 127 165" fill="none" stroke="#3ea8aa" stroke-width="5" stroke-linecap="round"/>
  <!-- # symbol -->
  <text x="135" y="148" font-family="'Courier New', Courier, monospace" font-weight="400" font-size="36" fill="#454c58">#</text>
  <!-- 27 -->
  <text x="130" y="260" font-family="'Courier New', Courier, monospace" font-weight="700" font-size="110" fill="#d4a027" letter-spacing="-5">27</text>
  <!-- play27 label -->
  <text x="125" y="318" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-weight="400" font-size="22" fill="#666">play27</text>
</svg>
