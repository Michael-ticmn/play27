<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" width="220" height="56">
  <!-- corn stalk left -->
  <line x1="14" y1="50" x2="14" y2="10" stroke="#2a2a1a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- corn stalk right -->
  <line x1="25" y1="50" x2="25" y2="14" stroke="#2a2a1a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- corn ear on left stalk -->
  <ellipse cx="14" cy="24" rx="3.5" ry="8" fill="#d4a027" opacity="0.85"/>
  <!-- corn ear on right stalk -->
  <ellipse cx="25" cy="28" rx="3.5" ry="8" fill="#d4a027" opacity="0.85"/>
  <!-- teal tops -->
  <line x1="14" y1="10" x2="14" y2="3" stroke="#3ea8aa" stroke-width="2" stroke-linecap="round"/>
  <line x1="25" y1="14" x2="25" y2="7" stroke="#3ea8aa" stroke-width="2" stroke-linecap="round"/>
  <!-- teal leaves -->
  <path d="M14 26 Q6 22 9 14" fill="none" stroke="#3ea8aa" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M14 36 Q22 32 19 24" fill="none" stroke="#3ea8aa" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M25 30 Q17 26 20 18" fill="none" stroke="#3ea8aa" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M25 40 Q33 36 30 28" fill="none" stroke="#3ea8aa" stroke-width="1.5" stroke-linecap="round"/>
  <!-- # symbol -->
  <text x="33" y="24" font-family="'Courier New', Courier, monospace" font-weight="400" font-size="14" fill="#454c58">#</text>
  <!-- divider -->
