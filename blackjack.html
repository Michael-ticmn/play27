<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>play27 — Blackjack</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=0.9.7">
<link rel="stylesheet" href="css/shared.css?v=0.9.7">
<link rel="stylesheet" href="css/blackjack.css?v=0.9.7">
</head>
<body>

<!-- ── SETUP SCREEN ── -->
<div id="setupScreen">
  <div class="setup-logo"><a href="index.html"><img src="assets/logo-dark.svg?v=0.9.7" alt="play27"></a></div>
  <div class="setup-title">Blackjack</div>
  <div class="setup-sub">beat the dealer to 21</div>
  <div class="setup-form">
    <div class="setup-row">
      <label>Bots</label>
      <select id="selBots">
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3" selected>3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
      </select>
    </div>
    <div class="setup-row">
      <label>Decks</label>
      <select id="selDecks">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="4">4</option>
        <option value="6" selected>6</option>
        <option value="8">8</option>
      </select>
    </div>
    <button class="btn-start" id="btnStart">Start Game</button>
  </div>
</div>

<!-- ── GAME BOARD ── -->
<div id="gameBoard">
  <div class="top-bar">
    <div class="logo-wrap" id="logoWrap">
      <img src="assets/logo-horizontal.svg?v=0.9.7" alt="play27" style="height:clamp(24px,3.5vw,36px);vertical-align:middle;">
      <div class="settings-dropdown" id="settingsDropdown">
        <div class="settings-title">Settings</div>
        <div class="settings-row">
          <span>Theme</span>
          <div class="theme-toggle">
            <button id="themeDark" data-theme="dark" class="active">Dark</button>
            <button id="themeLight" data-theme="light">Light</button>
          </div>
        </div>
        <a href="index.html" class="settings-home">Back to Games</a>
      </div>
    </div>
    <div class="top-title">Blackjack</div>
    <div class="top-right">Shoe: <span id="shoeCount">0</span></div>
  </div>

  <div class="table-area" style="position:relative;">
    <!-- Dealer -->
    <div class="dealer-area">
      <div class="dealer-label">Dealer</div>
      <div class="dealer-cards" id="dealerCards"></div>
      <div class="dealer-value" id="dealerValue"></div>
    </div>

    <!-- Bots -->
    <div class="bots-row" id="botsRow"></div>

    <!-- Player -->
    <div class="player-area">
      <div class="player-info">
        <span class="player-name">You</span>
        <span class="player-chips" id="playerChips">1000</span>
      </div>
      <div class="player-bet" id="playerBetLabel"></div>
      <div class="player-hands" id="playerHands"></div>
      <div class="player-value" id="playerValue"></div>
      <div class="player-result" id="playerResult"></div>
    </div>

    <!-- Bet overlay -->
    <div class="bet-overlay" id="betOverlay">
      <div class="bet-label">Place Your Bet</div>
      <div class="bet-amount" id="betAmount">50</div>
      <div class="bet-buttons">
        <button class="bet-btn" data-bet="10">10</button>
        <button class="bet-btn" data-bet="25">25</button>
        <button class="bet-btn active" data-bet="50">50</button>
        <button class="bet-btn" data-bet="100">100</button>
        <button class="bet-btn" data-bet="all">ALL IN</button>
      </div>
      <button class="deal-btn" id="btnDeal">Deal</button>
    </div>
  </div>

  <!-- Action bar -->
  <div class="action-bar" id="actionBar">
    <button class="action-btn hit-btn" id="btnHit">Hit</button>
    <button class="action-btn stand-btn" id="btnStand">Stand</button>
    <button class="action-btn double-btn" id="btnDouble">Double</button>
    <button class="action-btn split-btn" id="btnSplit">Split</button>
  </div>
</div>

<!-- ── Results Overlay ── -->
<div class="results-overlay" id="resultsOverlay">
  <div class="results-panel">
    <div class="results-title" id="resultsTitle">Round Complete</div>
    <div id="resultsBody"></div>
    <div class="results-buttons">
      <button class="btn-again" id="btnAgain">Play Again</button>
      <button class="btn-new" id="btnNew">New Game</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<div class="version-tag">v0.9.7</div>
<script type="module" src="js/blackjack.js?v=0.9.7"></script>
</body>
</html>
